services:
  falcondatarescue:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://mce:mce_secret@db:5432/mce_forensics
      SYNC_DATABASE_URL: postgresql+psycopg2://mce:mce_secret@db:5432/mce_forensics
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8010:8010"
    volumes:
      - recovery-output:/output
      - evidence-data:/evidence
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mce
      POSTGRES_PASSWORD: mce_secret
      POSTGRES_DB: mce_forensics
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mce -d mce_forensics"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  recovery-output:
  evidence-data:
  postgres-data:
